<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <!-- Mismo CSS compartido y script de registro -->
    <link rel="stylesheet" href="../static/css/auth.css">
    <script src="../static/js/register.js" defer></script>
</head>
<body>
    <header class="app-header">
        <a href="./index.html" class="header-title">Mi Fecha Médica</a>
    </header>

    <main class="auth-container">
        <h2>Registro</h2>

        <section class="text-area-container">
            <!-- RUT -->
            <input 
                class="text-area-style" 
                placeholder="Rut: 12.345.678-k" 
                type="text" 
                id="rut-input" 
                maxlength="12"
            >

            <!-- Contraseña con botón de ojo -->
            <div class="password-wrapper">
                <input 
                    class="text-area-style" 
                    placeholder="Contraseña" 
                    type="password" 
                    id="password-input"
                >
                <button type="button" class="btn-toggle-pass" id="btn-toggle">👁️</button>
            </div>

            <!-- Nombre Completo -->
            <input 
                class="text-area-style" 
                placeholder="Nombre completo" 
                type="text" 
                id="name-input"
            >

            <!-- Selector de Rol (Paciente / Médico) -->
            <select class="text-area-style" id="role-select">
                <option value="" disabled selected>Selecciona tu rol</option>
                <option value="paciente">Paciente</option>
                <option value="medico">Médico</option>
            </select>

            <!-- Botón de Registro -->
            <button type="button" id="btn-submit" class="btn-register">Registrarse</button>
            <p class="auth-redirect">¿Ya tienes cuenta? <a href="./login.html">Inicia sesión</a></p>
            
            <a href="./index.html" class="back-link">Volver al inicio</a>
        </section>
    </main>

</body>
</html>
