<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Tu Fecha Médica</title>
    <link rel="stylesheet" href="../static/css/auth.css">
    <script src="../static/js/login.js" defer></script>
</head>
<body>

    <!-- Header fijo superior -->
    <header class="app-header">
        <a href="./index.html" class="header-title">Tu Fecha Médica</a>
    </header>

    <!-- Tarjeta de formulario tradicional -->
    <main class="auth-container">
        <h2>Iniciar Sesión</h2>

        <form action="http://127.0.0.1:5000/login" method="POST" class="text-area-container">
            <!-- RUT -->
            <input 
                class="text-area-style" 
                placeholder="Rut: 12.345.678-k" 
                type="text" 
                name="rut"
                id="rut-input" 
                maxlength="12"
                required
            >

            <!-- Contraseña con botón de ojo -->
            <div class="password-wrapper">
                <input 
                    class="text-area-style" 
                    placeholder="Contraseña" 
                    type="password" 
                    name="password"
                    id="password-input"
                    required
                >
                <button type="button" class="btn-toggle-pass" id="btn-toggle">👁️</button>
            </div>

            <!-- Botón Submit -->
            <button type="submit" id="btn-login" class="btn-register">Ingresar</button>

            <!-- Navegación -->
            <p class="auth-redirect">¿No tienes cuenta? <a href="./register.html">Regístrate aquí</a></p>
            <a href="./index.html" class="back-link">Volver al inicio</a>
        </form>
    </main>

</body>
</html>
