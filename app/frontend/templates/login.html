<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../static/css/auth.css">
    <script src="../static/js/login.js" defer></script>
</head>
<body>

    <!-- Cambiado a auth-container -->
    <main class="auth-container">
        <h2>Iniciar Sesión</h2>

        <section class="text-area-container">
            <!-- RUT -->
            <input 
                class="text-area-style" 
                placeholder="Rut: 12.345.678-k" 
                type="text" 
                id="rut-input" 
                maxlength="12"
            >

            <!-- Contraseña con botón de ojo -->
            <div class="password-wrapper">
                <input 
                    class="text-area-style" 
                    placeholder="Contraseña" 
                    type="password" 
                    id="password-input"
                >
                <button type="button" class="btn-toggle-pass" id="btn-toggle">👁️</button>
            </div>

            <!-- Botón Login -->
            <button type="button" id="btn-login" class="btn-register">Ingresar</button>
        
            <p class="auth-redirect">¿No tienes cuenta? <a href="./register.html">Regístrate aquí</a></p>
        </section>
    </main>

</body>
</html>
